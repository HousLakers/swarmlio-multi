fleet:
  task_state_topic: /swarm_expl/drone_state
  contact_topic: /gazebo/contact_states
  log_subdir: fleet
  required_metrics:
    - fleet_coverage
    - overlap_ratio
    - minimum_inter_uav_distance
    - fleet_contact_count
    - map_consistency
    - task_allocation_state
    - process_liveness
safety_contract:
  contact:
    force_threshold_n: 8.0
    persistence_threshold_s: 0.25
    ground_contact_action: record_only
    obstacle_or_inter_uav_action: abort_when_threshold_met
  telemetry:
    startup_grace_s: 20.0
    preflight_soak_s: 24.0
    freshness_s: 5.0
    tf_freshness_s: 5.0
    command_ack_timeout_s: 1.0
    topic_owner_action: abort_on_missing_or_drift
    tf_action: abort_on_missing_or_parent_cross_talk
    occupancy_contract: startup_presence
  metrics:
    voxel_resolution_m: 0.25
    coverage_denominator: planner_box_volume
    overlap_denominator: smaller_per_uav_observed_set
    map_consistency_denominator: union_per_uav_observed_set
    coverage_missing_policy: abort_after_startup_grace
    ack_timeout_policy: fail_closed_even_if_recovered
    coverage_coalesce_sim_s: 2.0
    resource_sample_wall_s: 1.0
    resource_startup_mem_available_gib: 8
    resource_running_mem_available_gib: 3
    resource_startup_load1_max: 10.0
    resource_swap_activity: abort
  completion:
    source: /rosout:exploration_node_FINISH
    marker: finish exploration.
abort_on:
  - crash
  - severe_contact
  - corrupted_telemetry
  - namespace_or_tf_cross_talk
  - process_death
